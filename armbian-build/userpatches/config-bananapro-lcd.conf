# Konfiguracja Armbian build: Banana Pro + ekrany LeMaker
# Uzycie (w katalogu armbian/build): ./compile.sh bananapro-lcd
# Wszystko mozna nadpisac w linii polecen, np. ./compile.sh bananapro-lcd BRANCH=edge

# CO: te same ustawienia, co w poleceniu z armbian.com dla gotowych obrazow.
# DLACZEGO RELEASE na sztywno: projekt buduje tylko Debiana 13 (trixie).
# DLACZEGO BRANCH jest podany: bez niego compile.sh pyta o jadro w menu,
# a nakladki byly sprawdzane na jadrze current (6.18).
declare -g BOARD="bananapipro"
declare -g BRANCH="${BRANCH:-current}"
declare -g RELEASE="trixie"
declare -g BUILD_DESKTOP="${BUILD_DESKTOP:-no}"
declare -g BUILD_MINIMAL="${BUILD_MINIMAL:-yes}"
declare -g KERNEL_CONFIGURE="${KERNEL_CONFIGURE:-no}"

# CO: wlacza sterownik dotyku FT5x06 (edt-ft5x06) jako modul jadra.
# DLACZEGO: Armbian domyslnie go nie buduje, a wszystkie trzy ekrany go uzywaja.
# Tablica opts_m jest uwzgledniana w sumie kontrolnej konfiguracji, wiec
# build sam wie, ze nie moze uzyc gotowego jadra z serwera Armbian
# i kompiluje wlasne (pierwszy build trwa przez to dluzej).
function custom_kernel_config__lemaker_lcd_touch() {
	opts_m+=("TOUCHSCREEN_EDT_FT5X06")
}

# CO: dopisuje ekran do nazwy obrazu, np. ..._minimal_lcd7.img.
# DLACZEGO przez tablice: Armbian sam sklada EXTRA_IMAGE_SUFFIX
# z EXTRA_IMAGE_SUFFIXES i nadpisalby wartosc podana z linii polecen.
function user_config__lemaker_lcd_suffix() {
	[[ -n "${LCD_SUFFIX:-}" ]] && EXTRA_IMAGE_SUFFIXES+=("${LCD_SUFFIX}")
	return 0
}
